# Despliegue del monolito con Docker Compose: SQL Server 2025, carga de scripts/ y la
# aplicación. La contraseña de sa se lee de .env (no versionado); ver .env.example.
#
#   docker compose up --build -d
#   Vistas:  http://localhost:8080
#   Swagger: http://localhost:8080/swagger

name: personapi

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SA_PASSWORD:?Defina SA_PASSWORD en .env}"
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - personapi-net

  # Ejecuta 01_ddl.sql y 02_dml.sql en orden y termina. Los scripts son idempotentes,
  # así que repetir docker compose up no duplica datos.
  db-init:
    image: mcr.microsoft.com/mssql/server:2025-latest
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - ./scripts:/scripts:ro
    environment:
      SA_PASSWORD: "${SA_PASSWORD:?Defina SA_PASSWORD en .env}"
    entrypoint:
      - bash
      - -c
      - |
        for f in /scripts/01_ddl.sql /scripts/02_dml.sql; do
          echo "Ejecutando $$f"
          /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "$$SA_PASSWORD" -C -b -i "$$f" || exit 1
        done
    networks:
      - personapi-net

  personapi:
    build: .
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      ConnectionStrings__PersonaDb: "Server=sqlserver,1433;Database=persona_db;User Id=sa;Password=${SA_PASSWORD:?Defina SA_PASSWORD en .env};TrustServerCertificate=True"
    ports:
      - "8080:8080"
    networks:
      - personapi-net

volumes:
  sqldata:

networks:
  personapi-net:
